name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Pinned debug keystore (generate once, reuse via cache)
        uses: actions/cache@v4
        with:
          path: SF4Loader/debug.keystore
          key: debug-keystore-v1

      - name: Create debug keystore if missing
        run: |
          if [ ! -f SF4Loader/debug.keystore ]; then
            keytool -genkeypair -keystore SF4Loader/debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 -storetype JKS \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Assemble debug APK
        run: gradle -p SF4Loader assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SF4Loader-debug-${{ github.sha }}
          path: SF4Loader/app/build/outputs/apk/debug/app-debug.apk
