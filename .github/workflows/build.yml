name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages (runner has cmdline-tools preinstalled)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Assemble debug APK
        run: gradle -p SF4Loader assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SF4Loader-debug
          path: SF4Loader/app/build/outputs/apk/debug/app-debug.apk
